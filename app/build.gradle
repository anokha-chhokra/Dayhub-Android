plugins {
    id 'com.android.application'
}

android {
    namespace 'app.dayhub'
    compileSdk 35

    defaultConfig {
        applicationId 'app.dayhub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Deliberately empty: Day Hub is plain framework Java, no libraries.
}
